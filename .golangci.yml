version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - cyclop
    - decorder
    - dupl
    - errorlint
    - forbidigo
    - funcorder
    - funlen
    - gocognit
    - goconst
    - gocritic
    - gosec
    - lll
    - misspell
    - nilerr
    - noctx
    - nolintlint
    - revive
    - unconvert
    - wastedassign
  settings:
    decorder:
      dec-order: [const, var, type, func]
      disable-dec-order-check: false
      disable-init-func-first-check: false
      disable-dec-num-check: false
      disable-type-dec-num-check: true
      disable-const-dec-num-check: false
      disable-var-dec-num-check: false
    funcorder:
      constructor: true
      struct-method: true
    funlen:
      lines: 30
      statements: 15
      ignore-comments: true
    cyclop:
      max-complexity: 8
    gocognit:
      min-complexity: 15
    dupl:
      threshold: 100
    goconst:
      min-len: 3
      min-occurrences: 3
    lll:
      line-length: 100
    forbidigo:
      forbid:
        - pattern: ^fmt\.Print.*$
          msg: use log/slog
        - pattern: ^log\.(Print|Fatal|Panic).*$
          msg: use log/slog
    revive:
      confidence: 0.5
      rules:
        - name: argument-limit
          arguments: [4]
        - name: max-control-nesting
          arguments: [2]
        - name: modifies-parameter
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - cyclop
          - dupl
          - funlen
          - gocognit
          - goconst
      - path: _test\.go
        linters:
          - revive
        text: max-control-nesting
      - path: _test\.go
        linters:
          - lll
      - path: internal/(learn|schedule|gate|agentwatch|hook|audit|check|githook)/
        linters:
          - gosec
        text: G204|G304
      - path: internal/install/
        linters:
          - gosec
        text: G204|G304|G703

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

severity:
  default: error
